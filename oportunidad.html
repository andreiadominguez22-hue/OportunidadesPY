    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oportunidad | OportunidadesPY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="index.html">OportunidadesPY</a>
    </header>

    <main>
        <article id="detalle-oportunidad"></article>

        <a href="index.html#explorar">Volver a explorar oportunidades</a>
    </main>

    <script src="oportunidades.js"></script>
    <script src="script.js"></script>
    <script>
        const parametrosURL = new URLSearchParams(window.location.search);
        const idOportunidad = Number(parametrosURL.get("id"));
        const oportunidadEncontrada = oportunidades.find(function (oportunidad) {
            return oportunidad.id === idOportunidad;
        });

        const articuloOportunidad = document.querySelector("#detalle-oportunidad");

        if (!oportunidadEncontrada) {
            articuloOportunidad.innerHTML = `
                <h1>Oportunidad no encontrada</h1>
                <p>No existe una oportunidad asociada al ID indicado.</p>
            `;
        } else {
            const estadoPostulacion = estaVencida(oportunidadEncontrada.fechaLimiteISO)
                ? "Postulación cerrada"
                : "Postulación abierta";

            articuloOportunidad.innerHTML = `
                <header>
                    <p>Oportunidad de ${oportunidadEncontrada.categoria}</p>
                    <h1>${oportunidadEncontrada.titulo}</h1>
                    <p>${oportunidadEncontrada.organizacion}</p>
                </header>

                <dl>
                    <dt>Categoría</dt>
                    <dd>${oportunidadEncontrada.categoria}</dd>

                    <dt>Edad</dt>
                    <dd>${oportunidadEncontrada.edad}</dd>

                    <dt>Elegibilidad</dt>
                    <dd>${oportunidadEncontrada.elegibilidad}</dd>

                    <dt>Requisitos</dt>
                    <dd>${oportunidadEncontrada.requisitos}</dd>

                    <dt>Beneficios</dt>
                    <dd>${oportunidadEncontrada.beneficios}</dd>

                    <dt>Costo</dt>
                    <dd>${oportunidadEncontrada.costo}</dd>

                    <dt>Modalidad</dt>
                    <dd>${oportunidadEncontrada.modalidad}</dd>

                    <dt>Ubicación</dt>
                    <dd>${oportunidadEncontrada.ubicacion}</dd>

                    <dt>Fecha límite</dt>
                    <dd>${oportunidadEncontrada.fechaLimite}</dd>

                    <dt>Estado de la postulación</dt>
                    <dd>${estadoPostulacion}</dd>
                </dl>

                <section aria-labelledby="descripcion-titulo">
                    <h2 id="descripcion-titulo">Descripción</h2>
                    <p>${oportunidadEncontrada.descripcion}</p>
                </section>

                <a href="${oportunidadEncontrada.enlace}" target="_blank" rel="noopener noreferrer">Ir al sitio oficial</a>
            `;
        }
    </script>
</body>
</html>
